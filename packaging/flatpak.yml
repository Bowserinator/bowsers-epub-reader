app-id: io.github.bowsers.epubreader
runtime: org.gnome.Platform
runtime-version: '49' # pin to an installed/supported GNOME runtime that provides WebKitGTK 4.1
sdk: org.gnome.Sdk
command: bowsers_epub_reader
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Read-only access so a CLI/file-association path under $HOME works. The in-app "Open book"
  # dialog goes through the file chooser portal and needs no extra permission.
  - --filesystem=home:ro
  - --filesystem=/run/media:ro
  - --filesystem=/media:ro
modules:
  - name: bowsers-epub-reader
    buildsystem: simple
    build-commands:
      - ar x app.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/bowsers_epub_reader /app/bin/bowsers_epub_reader
      - if [ -d usr/lib ]; then cp -a usr/lib/. /app/lib/; fi
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.bowsers.epubreader.png
      - install -Dm644 usr/share/applications/io.github.bowsers.epubreader.desktop /app/share/applications/io.github.bowsers.epubreader.desktop
      - install -Dm644 io.github.bowsers.epubreader.metainfo.xml /app/share/metainfo/io.github.bowsers.epubreader.metainfo.xml
    sources:
      - type: file
        path: app.deb
      - type: file
        path: io.github.bowsers.epubreader.metainfo.xml
      - type: file
        path: icon.png
